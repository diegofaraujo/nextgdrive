[package]
name = "nextgdrive-adapter-localfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
md-5 = "0.11.0"
nextgdrive-application = { version = "0.1.0", path = "../application" }
nextgdrive-domain = { version = "0.1.0", path = "../domain" }
notify = "8"
tokio = { version = "1.54.1", features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
