[package]
name = "nextgdrive-composition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
jiff = "0.2.38"
nextgdrive-adapter-cache = { path = "../adapter-cache" }
nextgdrive-adapter-config = { path = "../adapter-config" }
nextgdrive-adapter-dbus = { path = "../adapter-dbus" }
nextgdrive-adapter-fuse = { path = "../adapter-fuse" }
nextgdrive-adapter-google = { path = "../adapter-google" }
nextgdrive-adapter-keyring = { path = "../adapter-keyring" }
nextgdrive-adapter-localfs = { path = "../adapter-localfs" }
nextgdrive-adapter-sqlite = { path = "../adapter-sqlite" }
nextgdrive-application = { path = "../application" }
nextgdrive-domain = { path = "../domain" }
nextgdrive-i18n = { path = "../i18n" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
