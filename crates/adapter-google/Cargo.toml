[package]
name = "nextgdrive-adapter-google"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
humantime = "2.4.0"
nextgdrive-application = { version = "0.1.0", path = "../application" }
nextgdrive-domain = { version = "0.1.0", path = "../domain" }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
