[package]
name = "nextgdrive-adapter-fuse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fuser = "0.18"
nextgdrive-application = { path = "../application" }
nextgdrive-domain = { path = "../domain" }
rustix = { version = "1.1", features = ["fs", "net", "std"] }
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
