[package]
name = "nextgdrive-adapter-localfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
md-5 = "0.11.0"
nextgdrive-application = { path = "../application" }
nextgdrive-domain = { path = "../domain" }
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
