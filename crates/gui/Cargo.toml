[package]
name = "nextgdrive-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nextgdrive-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
nextgdrive-adapter-config = { version = "0.1.0", path = "../adapter-config" }
nextgdrive-application = { version = "0.1.0", path = "../application" }
nextgdrive-domain = { version = "0.1.0", path = "../domain" }
nextgdrive-i18n = { version = "0.1.0", path = "../i18n" }
