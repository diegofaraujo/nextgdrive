[package]
name = "nextgdrive-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nextgdrive"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["cargo", "string"] }
nextgdrive-adapter-dbus = { path = "../adapter-dbus" }
nextgdrive-application = { path = "../application" }
nextgdrive-composition = { path = "../composition" }
nextgdrive-domain = { path = "../domain" }
nextgdrive-i18n = { path = "../i18n" }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
