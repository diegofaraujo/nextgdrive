[package]
name = "nextgdrive-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nextgdrive-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "background"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
ksni = "0.3.7"
nextgdrive-adapter-dbus = { version = "0.1.0", path = "../adapter-dbus" }
nextgdrive-application = { version = "0.1.0", path = "../application" }
nextgdrive-composition = { version = "0.1.0", path = "../composition" }
nextgdrive-domain = { version = "0.1.0", path = "../domain" }
nextgdrive-i18n = { version = "0.1.0", path = "../i18n" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "sync"] }

[build-dependencies]
glib-build-tools = "0.22"
